[package]
name = "pvr-psp2-sys"
edition = "2024"
version = "0.1.3"
rust-version = "1.95"
description = "Raw PVR, EGL and OpenGL ES bindings and native driver build tools for PlayStation Vita"
readme = "README.md"
repository = "https://github.com/jhq223/pvr-psp2-sys"
keywords = ["vita", "psp2", "powervr", "egl", "gles"]
categories = ["external-ffi-bindings", "graphics"]
links = "pvr_psp2"
publish = false
build = "build.rs"
exclude = ["**/*.vcxproj.user", "**/*.suo", "target/**"]

[features]
# Rebuild all four native modules using the official Windows PSVSDK.
build-driver = []
std = []
platform = ["std", "dep:vitasdk-sys"]
graphics = ["std", "dep:glow", "dep:vitasdk-sys", "dep:khronos-egl"]
video = ["platform"]

[[example]]
name = "pvr-native-check"
path = "native/check.rs"

[[test]]
name = "native_checks"
path = "native/tests/checks.rs"

[lints.rust]
unsafe_code = "allow"
warnings = "deny"

[[test]]
name = "compiler_sync"
path = "native/tests/compiler_sync.rs"

[dependencies]
glow = { version = "=0.18.0", optional = true }

[target.'cfg(not(target_os = "vita"))'.dependencies]
khronos-egl = { version = "=6.0.0", features = ["dynamic"], optional = true }

[target.'cfg(target_os = "vita")'.dependencies]
vitasdk-sys = { version = "=0.3.3", optional = true, features = ["SceLibKernel_stub", "SceKernelThreadMgr_stub", "SceProcessmgr_stub", "SceRtc_stub", "SceCtrl_stub", "SceTouch_stub", "ScePower_stub", "SceAudio_stub", "SceIofilemgr_stub", "SceKernelModulemgr_stub", "SceSysmodule_stub", "SceSysmem_stub", "SceAvPlayer_stub", "SceDisplay_stub", "SceKernelDmacMgr_stub", "SceAppMgr_stub", "SceIme_stub"] }

[[test]]
name = "video_contracts"
path = "native/tests/video_contracts.rs"

[[test]]
name = "gamma_metadata"
path = "native/tests/gamma_metadata.rs"
